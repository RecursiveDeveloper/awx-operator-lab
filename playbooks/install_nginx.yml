---
- name: Install nginx on all worker containers
  hosts: all
  become: true
  gather_facts: true
  vars:
    domain: "devops.com.co"
    nginx_web_root: >-
      {{ 
        '/usr/share/nginx/html' if ansible_os_family == 'RedHat' 
        else '/var/www/html' 
      }}
    nginx_conf_path: >-
      {{ 
        '/etc/nginx/conf.d' if ansible_os_family == 'RedHat' 
        else '/etc/nginx/sites-available' 
      }}

  tasks:
    - name: Print hello message with container hostname
      ansible.builtin.debug:
        msg: "Hello from container {{ ansible_hostname }}"

    - name: Install nginx (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install nginx (Fedora)
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Check if nginx master process is running
      ansible.builtin.command:
        cmd: ps aux
      register: ps_output
      changed_when: false

    - name: Start nginx
      ansible.builtin.command:
        cmd: nginx
      when: "'nginx: master process' not in ps_output.stdout"
      changed_when: false
    
    - name: Set index html page
      ansible.builtin.template:
        src: templates/index.html.j2
        owner: "{{ ansible_env['SUDO_USER'] }}"
        group: "{{ ansible_env['SUDO_USER'] }}"
        mode: '0644'
        dest: "{{ nginx_web_root }}/index.html"

    - name: Create nginx server block configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        owner: "{{ ansible_env['SUDO_USER'] }}"
        group: "{{ ansible_env['SUDO_USER'] }}"
        mode: '0644'
        dest: "{{ nginx_conf_path }}/devops.conf"

    - name: Enable nginx server block (Debian/Ubuntu only)
      ansible.builtin.file:
        src: "{{ nginx_conf_path }}/devops.conf"
        dest: "/etc/nginx/sites-enabled/devops.conf"
        state: link
      when: ansible_os_family == "Debian"

    - name: Add domain to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1  {{ domain }} www.{{ domain }}"
        state: present

    - name: Reload nginx
      ansible.builtin.command:
        cmd: nginx -s reload
      changed_when: false
