---
- name: Install nginx on all worker containers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Print hello message with container hostname
      ansible.builtin.debug:
        msg: "Hello from container {{ ansible_hostname }}"

    - name: Install nginx (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install nginx (Fedora)
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Check if port 80 is already in use
      ansible.builtin.command:
        cmd: ss -tlnp sport = :80
      register: port_check
      failed_when: false
      changed_when: false

    - name: Start nginx
      ansible.builtin.command:
        cmd: nginx
      when: port_check.stdout == ""
