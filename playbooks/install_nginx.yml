---
- name: Install nginx on all worker containers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Print hello message with container hostname
      ansible.builtin.debug:
        msg: "Hello from container {{ ansible_hostname }}"

    - name: Install nginx (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install nginx (Fedora)
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Check if systemd is available
      ansible.builtin.command:
        cmd: systemctl is-system-running
      register: systemd_check
      failed_when: false
      changed_when: false

    - name: Ensure nginx is started and enabled (systemd)
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      when: systemd_check.rc == 0

    - name: Check if nginx is already running
      ansible.builtin.command:
        cmd: pgrep -x nginx
      register: nginx_running
      failed_when: false
      changed_when: false
      when: systemd_check.rc != 0

    - name: Start nginx directly (no systemd in container)
      ansible.builtin.command:
        cmd: nginx
      when: systemd_check.rc != 0 and nginx_running.rc != 0
