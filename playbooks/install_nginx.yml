---
- name: Install nginx on all worker containers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Print hello message with container hostname
      ansible.builtin.debug:
        msg: "Hello from container {{ ansible_hostname }}"

    - name: Install nginx (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install nginx (Fedora)
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Check if nginx master process is running
      ansible.builtin.command:
        cmd: ps aux
      register: ps_output
      changed_when: false

    - name: Start nginx
      ansible.builtin.command:
        cmd: nginx
      when: "'nginx: master process' not in ps_output.stdout"
    
    - name: Set nginx web root path
      ansible.builtin.set_fact:
        nginx_web_root: "{{ '/usr/share/nginx/html' if ansible_os_family == 'RedHat' else '/var/www/html' }}"

    - name: Set index html page
      ansible.builtin.copy:
        src: files/index.html
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        mode: '0644'
        dest: "{{ nginx_web_root }}/index.html"

    - name: Reload nginx
      ansible.builtin.command:
        cmd: nginx -s reload
      changed_when: false
