---
- name: Install nginx on all worker containers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Print hello message with container hostname
      ansible.builtin.debug:
        msg: "Hello from container {{ ansible_hostname }}"

    - name: Install nginx (Debian/Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install nginx (Fedora)
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Check if nginx is already running
      ansible.builtin.command:
        cmd: pgrep -x nginx
      register: nginx_running
      failed_when: false
      changed_when: false

    - name: Start nginx
      ansible.builtin.command:
        cmd: nginx
      when: nginx_running.rc != 0
